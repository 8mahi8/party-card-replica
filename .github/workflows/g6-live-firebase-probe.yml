name: G6 one-off live Firebase 2-seat probe (development only)

on:
  # The one-off live probe passed in CI run 40934112303. Avoid repeated writes
  # to the shared Firebase project on normal development PR updates.
  # Re-enable a one-off trigger deliberately if this probe needs repeating.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-g6:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    container:
      image: mcr.microsoft.com/playwright:v1.62.0-noble
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # G6 protocol fix validation: preserve empty defender card arrays via commandJson.
      - name: Validate live smoke ESM
        run: node --check tests/v2-g6-live-firebase.browser.mjs
      - name: Install browser driver for G6 test (not shipped with game)
        run: npm install --no-save --no-package-lock --ignore-scripts playwright@1.62.0
      - name: Real RTDB online 2-browser touch test (ephemeral lab room)
        env:
          G6_LIVE_FIREBASE: '1'
        run: node tests/v2-g6-live-firebase.browser.mjs
