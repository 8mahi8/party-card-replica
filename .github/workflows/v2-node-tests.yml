name: Card rules / Node tests

on:
  push:
    branches:
      - refactor/v2-foundation-review-20261027
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: Node 22 test suite
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: ''
      - run: npm test
