name: G7 temporary live Firebase cleansing smoke (development only)

on:
  workflow_dispatch:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  live-cleansing:
    if: (github.event_name == 'workflow_dispatch' && github.ref_name == 'refactor/v2-foundation-review-20261027') || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'refactor/v2-foundation-review-20261027')
    runs-on: ubuntu-latest
    timeout-minutes: 8
    container:
      image: mcr.microsoft.com/playwright:v1.62.0-noble
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check isolated experiment branch, test syntax and portable HTML
        env:
          TARGET_BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          test "$TARGET_BRANCH" = 'refactor/v2-foundation-review-20261027'
          node --check tests/v2-g7-live-cleansing.browser.mjs
          node v2/demo/build-online.mjs --check
      - name: Install WebKit browser driver for test only
        run: npm install --no-save --no-package-lock --ignore-scripts playwright@1.62.0
      - name: Test Melody and Song in two temporary real Firebase rooms
        env:
          G7_LIVE_CLEANSING: '1'
        run: node tests/v2-g7-live-cleansing.browser.mjs
