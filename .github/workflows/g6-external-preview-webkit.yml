name: G6 external HTTPS read-only WebKit preview validation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    container:
      image: mcr.microsoft.com/playwright:v1.62.0-noble
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright browser driver
        run: npm install --no-save --no-package-lock --ignore-scripts playwright@1.62.0
      - name: Validate HTTPS module imports and iPad-sized layout (no DB writes)
        run: node tests/v2-g6-https-preview.browser.mjs
