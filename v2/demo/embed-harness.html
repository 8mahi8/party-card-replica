<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>V2 local embed viewport laboratory</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#ecf2f7;font:14px system-ui,sans-serif;color:#18334e}
header{padding:14px;background:#d4e2ee}
main{max-width:1024px;margin:0 auto;padding:12px}
iframe{display:block;width:100%;height:460px;border:2px solid #40617d;border-radius:4px;background:#080e1d}
small{display:block;padding:10px 0;color:#435c73}
</style>
</head>
<body>
<header>LOCAL EMBED SIZE LAB — NOT A GOOGLE SITES PAGE</header>
<main>
<iframe id="game-embed" src="./standalone.html" sandbox="allow-scripts allow-same-origin" title="V2 offline card game"></iframe>
<small>This test approximates a fixed-height embedded frame only. It does not reproduce Google Sites sandbox restrictions or iPad Safari.</small>
</main>
</body>
</html>
