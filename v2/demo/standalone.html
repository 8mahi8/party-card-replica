<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>CARD LAB V2｜試験用ホットシート</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;color:#eef7ff;background:#080e1d;font-size:15px}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(ellipse 80% 50% at 50% -8%,#21365e 0%,#0b1427 70%,#080e1d 100%);min-height:100vh}
button{font:inherit;touch-action:manipulation;cursor:pointer}
button:focus-visible{outline:3px solid #ffd981;outline-offset:3px}
button:disabled{opacity:.45;cursor:not-allowed}
#v2-root{max-width:1060px;margin:0 auto;padding:18px 18px 42px}
.topline{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:12px}
.brand{font-size:clamp(22px,3vw,33px);letter-spacing:.07em;font-weight:900}
.brand em{font-style:normal;color:#82ddf9}
.sub{color:#a7bdd5;font-size:12px;margin-top:3px}
.phase{display:block;flex:0 0 auto;padding:8px 17px;color:#0a2431;border-radius:999px;background:#81dbeb;font-weight:800;font-size:13px}
.disclaimer{background:#251d2b;border:1px solid #6b526a;color:#ffdecb;padding:12px 15px;line-height:1.6;border-radius:13px;font-size:12px;margin-bottom:14px}
.score{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.seat{background:#14243b;border:1px solid #344c6e;border-radius:17px;padding:16px}
.seat strong{font-size:19px}
.seat small{color:#a7bbd7;margin-left:7px}
.values{display:flex;gap:clamp(8px,2vw,24px);flex-wrap:wrap;margin-top:10px;font-size:13px;color:#c2d8ef}
.values b{font-size:20px;color:#fff}
.stage{border-radius:19px;margin-top:15px;background:#132137;border:1px solid #304766;padding:20px}
.stage-heading h1,.pass-screen h1{font-size:clamp(18px,3vw,23px);margin:0 0 5px}
.stage-heading p{color:#a7bfdc;font-size:13px;margin:0 0 14px}
.pass-screen{text-align:center;margin-top:15px;padding:clamp(35px,8vw,80px) 20px;background:#14233b;border:1px solid #3d5f87;border-radius:20px;min-height:330px}
.pass-screen p{max-width:560px;margin:12px auto;color:#c6dff1;line-height:1.65}
.seal{margin:auto auto 14px;background:#233b63;border-radius:50%;display:grid;place-items:center;width:68px;height:68px;font-size:42px;color:#9ee8ec}
.pass-screen .hint{font-size:13px;color:#9ebad6;margin-bottom:26px}
/* The handoff must fit even a short Google Sites-like embed window. */
.compact-pass{min-height:0;padding:clamp(15px,3vh,28px) 12px}
.compact-pass .seal{width:46px;height:46px;font-size:29px;margin-bottom:8px}
.compact-pass h1{font-size:20px}
.compact-pass p{margin:6px auto;font-size:12px;line-height:1.45}
.compact-pass .hint{margin-bottom:12px}
.compact-pass .primary{min-height:50px}
.compact-pass .scenario-launch{margin-top:8px;font-size:12px;min-height:44px;padding:8px 12px}
.trade-offer{margin:8px 0 15px;background:#1a3550;border:1px solid #65a8bd;border-radius:12px;padding:12px;display:flex;gap:10px;justify-content:space-between;align-items:center;flex-wrap:wrap;color:#e2f9ff}
.trade-reply{margin-top:7px;background:#132137;border:1px solid #304766;border-radius:15px;padding:11px 12px 90px}
.trade-research-note{font-size:10px;color:#fed5bd;margin:0 0 8px}
.trade-mini-scores{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px}
.trade-mini-seat{display:flex;gap:5px 10px;align-items:center;flex-wrap:wrap;background:#182e45;border:1px solid #31536a;border-radius:9px;padding:7px;font-size:12px}
.trade-mini-seat strong{font-size:13px;color:#b5f4ff}
.trade-mini-seat b{font-size:13px;color:#fff}
.trade-reply .trade-offer{margin:8px 0;padding:8px 10px}
.trade-reply h2{margin:7px 0 4px}
.trade-hint{font-size:11px;color:#c4daef;line-height:1.4;margin:0 0 8px}
.trade-hand{grid-template-columns:repeat(auto-fill,minmax(135px,1fr));gap:7px}
.trade-hand .battle-card{min-height:75px;padding:8px}
.trade-reply .status{margin:7px 0 0}
/* Two deliberate decisions remain visible above Safari's safe-area inset. */
.buy-decision .buy-offer{margin:10px 0;padding:12px 10px}
.buy-choice-bar .buy-decline{flex:1;min-width:0;min-height:54px;background:#253b55;color:#eff9ff;border-color:#7796ba;font-weight:800}
.buy-choice-bar .confirm{flex:1;min-width:0}
.buy-decision{min-height:200px}
.exchange-editor{background:#172f49;border:1px solid #487899;border-radius:14px;padding:12px;margin:11px 0 15px}
.exchange-editor h2{font-size:14px}
.exchange-controls{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px}
.exchange-controls label{font-size:12px;font-weight:800;color:#c8e8fb;display:flex;flex-direction:column;gap:6px}
.exchange-controls input{width:100%;min-width:0;min-height:50px;font:inherit;font-size:20px;font-weight:800;text-align:center;color:#fff;background:#0d1c30;border:2px solid #6389a7;border-radius:10px;padding:8px 5px}
.exchange-controls input:focus{outline:3px solid #76dce3;outline-offset:1px}
.exchange-editor .trade-hint{margin:10px 0 0}

.trade-offer strong{font-size:14px;line-height:1.4}
.trade-offer span{font-size:13px;color:#ffdf97;font-weight:800}
.battle-card:disabled{opacity:.48;border-style:dashed;cursor:not-allowed}
.battle-card:disabled .rank{visibility:hidden}
h2{font-size:15px;margin:0 0 11px;color:#d4eaff}
h2 small{font-weight:400;color:#8fa7c7;margin-left:5px;font-size:12px}
.targets{margin-bottom:18px}
.choice-row{display:flex;gap:10px;flex-wrap:wrap}
.choice-row button{padding:11px 20px;border-radius:12px;background:#233554;border:1px solid #405d84;color:#e2eefd;min-width:100px;min-height:46px}
.choice-row button.chosen{background:#0f4660;border-color:#67d4ef;box-shadow:inset 0 0 0 1px #67d4ef}
.cards-panel{margin-top:18px}
.hand-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(152px,1fr));gap:10px}
.battle-card{background:linear-gradient(155deg,#294362,#1a2d46);border:2px solid #44618a;border-radius:13px;text-align:left;color:#f5f9ff;min-height:96px;padding:12px;display:flex;flex-direction:column;position:relative;gap:4px;transition:background .12s ease}
.battle-card.picked{background:linear-gradient(155deg,#285763,#153d51);border-color:#79e8cf;box-shadow:0 0 0 1px #79e8cf}
.battle-card:active{transform:scale(.985)}
.battle-card .rank{align-self:flex-end;color:#9ccada;font-size:14px;line-height:16px;font-weight:900;min-height:17px}
.battle-card.picked .rank{color:#89efb7}
.card-label{font-size:13px;line-height:1.4;font-weight:800;word-break:break-word}
.battle-card small{font-size:11px;color:#acc4df;margin-top:auto}
.empty,.muted{color:#809bb8;font-size:13px}
.selection{margin:18px 0;padding:14px;border-radius:13px;background:#0b192c;border:1px solid #29486a}
.picks{display:flex;gap:8px;flex-wrap:wrap;min-height:26px}
.pick-index{padding:6px 8px;font-size:12px;background:#1c3852;border-radius:9px;color:#d6f6f9}
.status{color:#e8d6a3;font-size:12px;line-height:1.55;min-height:18px}
.primary{background:linear-gradient(100deg,#88e2e4,#9deac3);color:#062939;border:0;border-radius:14px;font-size:17px;font-weight:900;min-height:54px;padding:14px 20px}
.primary:active{filter:brightness(.85)}
.wide{display:block;width:100%;max-width:600px;margin:auto}
.action-bar{position:fixed;bottom:max(12px,env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);z-index:20;width:min(calc(100% - 32px),600px);max-width:600px;display:flex;align-items:stretch;gap:7px}
.action-bar .confirm{position:static;flex:1;min-width:0;width:auto;max-width:none;margin:0;box-shadow:0 8px 28px #060e1cdd;border:2px solid #16394a}
.action-bar .discard-option{flex:0 1 43%;min-width:0;padding:6px 8px;min-height:58px;line-height:1.25;border:2px solid #59728c;background:#24354b;color:#e7f4ff;box-shadow:0 8px 28px #060e1c99}
.discard-option strong{font-size:15px;display:block}
.discard-option small{display:block;font-size:10px;margin-top:2px;color:#c9d9ec}
.stage{padding-bottom:105px}
footer{margin-top:18px;display:flex;align-items:center;gap:12px;justify-content:space-between;flex-wrap:wrap;color:#89a0bc;font-size:11px}
/* Reserve space beneath footer actions when the fixed confirm bar is shown. */
.stage+footer{padding-bottom:96px}
.quiet{border:1px solid #46566f;color:#b3cbe4;background:transparent;border-radius:10px;min-height:44px;padding:10px 14px}
@media(max-width:640px){
#v2-root{padding:12px 10px 28px}
.disclaimer{font-size:11px}
.score{gap:7px}
.seat{padding:11px}
.values{gap:8px}
.values b{font-size:16px}
.stage{padding:14px 11px}
.hand-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:7px}
.battle-card{min-height:92px;padding:9px}
.card-label{font-size:12px}
}
@media(prefers-reduced-motion:reduce){.battle-card{transition:none}}
</style>
</head>

function mountV2Lab(root,controller=createV2LabController()){

 root.addEventListener('click',event=>{
   const node=event.target?.closest?.('button');
   if(!node||!root.contains(node))return;
   const action=node.getAttribute('data-action');
   const kind=node.getAttribute('data-card');
   let localError=null;
   let handoff=false;
   let submitRejected=false;
   try{
     if(action==='trade-demo'){
       controller.loadTradeTrial();resetArmed=false;handoff=true;
     }else if(action==='buy-demo'){
       controller.loadBuyTrial();resetArmed=false;handoff=true;
     }else if(action==='exchange-demo'){
       controller.loadExchangeTrial();resetArmed=false;handoff=true;
     }else if(action==='reset'){
       if(!resetArmed)resetArmed=true;
       else{controller.reset();resetArmed=false;handoff=true;}
     }else if(action==='reveal'){
       resetArmed=false;controller.reveal();
     }else if(['submit','discard','buy-accept','buy-decline'].includes(action)){
       resetArmed=false;
       const poolInputs=[...(root.querySelectorAll?.('[data-exchange-field]')??[])];
       const allocation=poolInputs.length===3?
         Object.fromEntries(poolInputs.map(input=>[
           input.getAttribute('data-exchange-field'),Number(input.value)
         ])):null;
       const outcome=controller.submit({
         discard:action==='discard',
         ...(action==='buy-accept'?{accept:true}:action==='buy-decline'?{accept:false}:{}),
         ...(allocation?{allocation}:{})
       });
       // A successful command conceals the cards or ends the match.
       // Scroll back to the top inside the embed frame so the next player
       // sees the pass screen rather than an empty bottom viewport.
       handoff=outcome.ok && !outcome.view.revealed;
       submitRejected=!outcome.ok;
     }else if(kind==='hand'){
       resetArmed=false;controller.toggle({instanceId:decodeURIComponent(node.getAttribute('data-id'))});
     }else if(kind==='learned'){
       resetArmed=false;controller.toggle({learnedDefinitionId:decodeURIComponent(node.getAttribute('data-id'))});
     }else if(node.hasAttribute('data-target')){
       resetArmed=false;controller.setTarget(decodeURIComponent(node.getAttribute('data-target')));
     }else return;
   }catch(error){
     localError=String(error?.message??'この操作はできません').slice(0,180);
   }
   render();
   // Scroll the frame, not the hosting Google Sites page. Do this only
   // after successful handoff/reset, never on ordinary card selection.
   if(handoff)root.ownerDocument?.defaultView?.scrollTo?.(0,0);
   // An invalid tap must remain visible after the full screen rerenders.
   if(localError){
     const feedback=root.querySelector?.('[role="status"]');
     if(feedback)feedback.textContent=localError;
   }
   // A rejected submission keeps the turn editable. In short embed frames,
   // bring the explanation above the fixed confirm bar by scrolling only
   // THIS iframe window, never the parent Google Sites page.
   if(submitRejected||localError){
     const feedback=root.querySelector?.('[role="status"]');
     const win=root.ownerDocument?.defaultView;
     if(feedback&&win){
       const note=feedback.getBoundingClientRect();
       const confirmTop=root.querySelector?.('.confirm')?.getBoundingClientRect().top
         ??win.innerHeight;
       const delta=note.bottom>confirmTop-12 ? note.bottom-(confirmTop-12)
         :note.top<12 ? note.top-12 : 0;
       if(delta)win.scrollTo(0,Math.max(0,win.scrollY+delta));
     }
   }

}
