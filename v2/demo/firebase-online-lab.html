<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ゴッドフィールド V2｜オンライン2人研究版</title>
<style>
:root{font-family:system-ui,-apple-system,"Hiragino Kaku Gothic ProN",sans-serif;color:#174d4a;background:#8bd8cc}
*{box-sizing:border-box}body{margin:0;min-height:100dvh;background:radial-gradient(ellipse at 22% 18%,#d8fcf4 0%,transparent 57%),radial-gradient(ellipse at 76% 78%,#8dc8ed 0%,transparent 56%),linear-gradient(135deg,#9be2d5,#9bcee3);color:#174d4a}
button,input{font:inherit;touch-action:manipulation;-webkit-tap-highlight-color:transparent}button{cursor:pointer;min-height:42px;border:1px solid #308b83;border-radius:7px;padding:7px 12px;background:linear-gradient(#effff7,#b4e6d2);color:#075f5a;font-weight:800;box-shadow:0 2px 0 #338b83}button:disabled{opacity:.48;cursor:default;box-shadow:none}
button.primary{background:linear-gradient(#087d76,#00655e);color:white;border-color:#005c55;box-shadow:0 2px 0 #034742}
main{max-width:940px;min-height:100dvh;margin:auto;padding:0 10px 12px}
.brandline{min-height:28px;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:3px 12px;margin:0 -10px;background:#08786c;color:#f3fff8;font-size:13px;font-weight:900}
.brandline span{font-size:10px;font-weight:700;color:#d0f5d9}
.notice{margin:6px 0;padding:0 8px;font-size:11px;color:#246f68}
.notice summary{cursor:pointer;font-weight:800}
.notice p{margin:4px 0;line-height:1.5}
.panel{border:1px solid #5baca0;background:#e6fff2c9;border-radius:9px;padding:9px;margin:8px 0;box-shadow:0 2px 5px #0c6d6a18}
h2{font-size:15px;margin:3px 0 9px}
.inline{display:flex;flex-wrap:wrap;gap:7px;align-items:center}.inline>*{flex:1;min-width:100px}
input{min-height:42px;max-width:185px;padding:7px;font-size:18px;letter-spacing:.16em;text-align:center;color:#07584f;border:1px solid #5caaa0;border-radius:7px;background:white}
#lobby{margin-top:12px}#lobby .inline{margin-top:7px}
.connection-bar{display:flex;align-items:center;flex-wrap:wrap;gap:8px;padding:5px 8px;margin-top:7px;background:#e3fff0a8;border:1px solid #70b9af;border-radius:7px}
#roomLabel{font-size:13px;letter-spacing:.05em;color:#006a65}#roleLabel{font-size:11px;font-weight:700}
#status{margin:0;flex:1 1 180px;min-height:18px;font-size:11px;line-height:1.4;color:#226b63}
#battle[hidden],#lobby[hidden],#actions[hidden],#retryPanel[hidden]{display:none}
.battle-board{display:flex;flex-direction:column;gap:7px;margin:6px 0 0}
.battle-topline{display:flex;justify-content:space-between;gap:7px;align-items:center;border-bottom:4px solid #058377;font-size:11px;font-weight:800}
.battle-topline .mode{padding:2px 9px;border-radius:4px 4px 0 0;background:#058377;color:white}
.scores{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px}
.score{background:linear-gradient(#f9fff9,#d8f4e0);border:1px solid #79bba2;border-radius:8px;padding:6px 8px;min-width:0}
.score.active{border:2px solid #128e80;padding:5px 7px;box-shadow:0 0 0 2px #baffcd}
.score .player-title{display:flex;align-items:center;justify-content:space-between;gap:4px;font-size:12px;color:#075c55;font-weight:800}
.score .turn-dot{background:#168e7c;color:white;font-size:9px;border-radius:12px;padding:1px 6px}
.score .statline{display:flex;flex-wrap:wrap;gap:5px;font-size:11px;font-weight:800;margin-top:5px}
.score .statline span{background:#fafff1;border-radius:4px;padding:1px 4px;border:1px solid #b8daca}
.score .statline .hp{color:#bf4e54}.score .statline .mp{color:#2869b5}
.arena{min-height:116px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:8px;align-items:stretch}
.selected-tray{min-width:0;border:1px solid #5caca1;border-radius:8px;background:#e8fff4ad;padding:6px 8px}
.selected-tray header{font-size:10px;font-weight:800;color:#35786f;letter-spacing:.04em}
#selectionPreview{margin-top:5px;display:flex;gap:4px;flex-wrap:wrap;align-content:start;min-height:45px}
#selectionPreview .picked{max-width:100%;font-size:11px;background:#fffde4;border:1px solid #7fb7a3;padding:4px 6px;border-radius:4px;font-weight:800}
#selectionPreview .empty{font-size:11px;color:#558f86;padding:6px 0}
.phase-area{display:flex;flex-direction:column;align-items:stretch;justify-content:center;text-align:center;gap:4px;padding:5px;background:#f4fff9aa;border-radius:8px;border:1px solid #77b9b2}
#phase{font-size:14px;font-weight:900;color:#087d72}
#battleHint{font-size:11px;line-height:1.35;color:#376e65;min-height:27px}
#incomingAttack{font-size:11px;line-height:1.4;color:#a23c37;font-weight:800;padding:4px 5px;border:1px solid #d4a19a;border-radius:5px;background:#fff4e5}
#incomingAttack[hidden]{display:none}
#combatRoute{font-size:11px;font-weight:800;color:#176d68;min-height:14px}
#combatRoute:empty{display:none}
#selectionTotal{font-size:11px;color:#356a62;min-height:14px;line-height:1.35}
#selectionTotal:empty{display:none}
#selectionPreview .picked b{font-size:10px;color:#b05148;margin-right:3px}
#actions{display:flex;flex-wrap:wrap;gap:6px;padding:0}
#actions button{flex:1 1 100px;min-width:90px;min-height:42px;font-size:12px}
#actions button[hidden]{display:none}
#defend{background:linear-gradient(#e9f6ff,#aad5ef);border-color:#5ca0c9;color:#1a638b}
.hand-area{padding:5px 6px 8px;background:#d6fff0bd;border-radius:7px;border-top:6px solid #078376}
.hand-area header{display:flex;align-items:center;justify-content:space-between;font-size:12px;font-weight:900;padding:1px 5px 6px}
#handCount{color:#31786f;font-weight:700;font-size:10px}
.hand{display:flex;align-items:stretch;gap:5px;min-height:100px;max-width:100%;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x proximity;padding:4px 4px 9px;overscroll-behavior-x:contain;-webkit-overflow-scrolling:touch}
.hand button{flex:0 0 83px;width:83px;min-height:106px;max-height:128px;scroll-snap-align:start;padding:3px;display:flex;align-items:stretch;flex-direction:column;gap:3px;text-align:center;position:relative;border:2px solid #83bda8;border-radius:5px;color:#184b3c;background:linear-gradient(#fbffe7,#d4f4d0);font-size:10px;box-shadow:0 2px 0 #6ca696}
.hand button.armor{background:linear-gradient(#edfff3,#c9ecdf)}.hand button.miracle{background:linear-gradient(#fff5e9,#f6d4a8)}.hand button.item{background:linear-gradient(#f3efff,#d5d9f5)}
.hand button.selected{transform:translateY(-3px);border-color:#c25a4b;background:linear-gradient(#fff7ce,#f7e2b1);box-shadow:0 3px 0 #c46a52,0 0 0 1px #fceba4}
.hand .artmark{height:40px;display:grid;place-items:center;border-radius:3px;background:radial-gradient(circle at 65% 30%,#effff9,#92cdb5);color:#237c70;font-size:24px;font-weight:600}
.hand .armor .artmark{background:radial-gradient(circle,#eafff7,#a0d5ce);color:#2876a0}
.hand .miracle .artmark{background:radial-gradient(circle,#fff3e0,#d5b4db);color:#8a5997}
.hand .item .artmark{background:radial-gradient(circle,#faf2ff,#bfcae4);color:#4b78a5}
.hand .cardname{font-size:10px;line-height:1.15;min-height:21px;display:grid;place-items:center;font-weight:900;overflow:hidden}
.hand .cardstats{font-size:11px;color:#195547;font-weight:900;white-space:nowrap}
.hand .cardprice{font-size:9px;color:#6d642d;text-align:right}
#retryPanel{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:0}
#retryPanel p{font-size:11px;color:#446e64;margin:0;flex:1 1 170px}
#retryPanel button{font-size:12px}
@media(max-width:480px){
main{padding:0 6px 8px}.brandline{margin:0 -6px}
.notice{font-size:10px}.connection-bar{gap:5px;padding:4px 5px}
.panel{padding:7px;margin:5px 0}.battle-board{gap:5px}
.score{padding:5px}.score.active{padding:4px}.score .statline{gap:3px;font-size:10px}
.arena{min-height:98px}.phase-area{padding:4px}#phase{font-size:12px}
.hand button{flex-basis:78px;width:78px;min-height:101px}.hand .artmark{height:36px}
}
@media(max-height:520px){.notice p{display:none}.arena{min-height:86px}.hand button{min-height:94px}.hand .artmark{height:30px}}
</style>
</head>
<body><main>
<header class="brandline"><strong>GOD FIELD <span>ゴッドフィールド</span></strong><span>ONLINE LAB · 2人用</span></header>
<details class="notice"><summary>開発・試遊版について（固定補充・原作未完成）</summary>
<p>原作の対戦画面を参考にした研究版です。カードは固定補充で、全353種類を再現したものではありません。ホスト側のタブを閉じると試合が停止します。学校iPadは未検証です。</p>
</details>
<section id="lobby" class="panel">
<h2>対戦する</h2>
<div class="inline"><button id="create" class="primary">部屋を作る</button></div>
<div class="inline"><input id="joinCode" inputmode="numeric" maxlength="5" aria-label="5桁のルーム番号" placeholder="5桁の番号"><button id="join">部屋に参加</button></div>
</section>
<section class="connection-bar" aria-live="polite">
<strong id="roomLabel">未接続</strong><span id="roleLabel">接続前</span>
<p id="status" role="status">Firebase接続を準備しています</p>
</section>
<section id="battle" class="battle-board" hidden>
<div class="battle-topline"><span>G.F. · 研究対戦</span><span class="mode">1 対 1</span></div>
<div id="scores" class="scores" aria-label="プレイヤーのHP・MP・所持金"></div>
<div class="arena">
<div class="selected-tray"><header>選択中の神器 · タップ順</header><div id="selectionPreview"><span class="empty">カードをタップして選択</span></div><div id="selectionTotal" aria-live="polite"></div></div>
<div class="phase-area"><div id="phase"></div><div id="combatRoute"></div><div id="incomingAttack" aria-live="polite" hidden></div><div id="battleHint">手札の神器をタップ</div></div>
</div>
<div id="actions" hidden>
<button id="attack" class="primary">攻撃する</button>
<button id="defend" class="primary">防御する／許す</button>
<button id="pray">祈る</button>
<button id="discard">捨てる</button>
</div>
<section class="hand-area"><header>神器 <span id="handCount">自分の手札</span></header>
<div id="hand" class="hand" aria-label="自分の神器を選択"></div>
</section>
<section id="retryPanel" class="panel" hidden>
<p>操作の応答待ち。反映が遅いときは同じ操作を再送できます。</p>
<button id="retry" type="button">同じ操作を再送</button>
</section>
</section>
</main>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
<script type="module">
import {migrateLegacyCatalog} from '../legacy-adapter.mjs';
import {createStagingRoom} from '../staging-room.mjs';
import {createFirebaseTwoSeatHostFixture,joinFirebaseTwoSeatGuestFixture}
 from '../firebase-two-seat-transport-fixture.mjs';
import {VERIFIED_BASIC_CARDS} from '../../src/verified-basic-cards.mjs';

const $=id=>document.getElementById(id);
const {byId:catalog}=migrateLegacyCatalog();
const names=new Map(VERIFIED_BASIC_CARDS.map(c=>[c.id,c.referenceName]));
const url='https://mygame-df915-default-rtdb.firebaseio.com/';
let db=null,session=null,view=null,seat=null,joined=false,waiting=false,selection=new Set(),lastRevision=-1,pendingId=null,pendingCommand=null,retrying=false;
const randomId=()=>{const a=new Uint32Array(2);crypto.getRandomValues(a);return Array.from(a,x=>x.toString(36)).join('-');};
const code=()=>{const a=new Uint32Array(1);crypto.getRandomValues(a);return String(10000+a[0]%90000);};
const feedback=s=>{$('status').textContent=String(s);};
function ensureDb(){
 if(db)return db;
 if(!window.firebase?.database)throw Error('Firebase SDKを読み込めませんでした');
 let app;
 try{app=firebase.app('godfield-v2-lab')}catch{app=firebase.initializeApp({databaseURL:url},'godfield-v2-lab')}
 db=app.database();return db;
}
function onError(error){feedback((error?.commandRejected?'操作エラー: ':'通信エラー: ')+(error?.message||String(error)))}
function callbacks(){
 return {
  onView(next){
   if(!next)return;
   if(next.revision!==lastRevision){selection.clear();lastRevision=next.revision;}
   view=next;render();
  },
  onStatus(info){
   if(seat==='A')joined=!!info.joined;
   render();
  },
  onReceipt(ack){
   if(!ack||ack.id!==pendingId)return;
   waiting=false;pendingId=null;pendingCommand=null;retrying=false;
   if(!ack.ok)onError(ack.error);
   else feedback('操作を反映しました');
   render();
  },
  onError
 };
}
function showSeatLabel(id){return id==='A'?'P1（ホスト）':'P2（ゲスト）'}
function render(){
 $('roomLabel').textContent=session?'ルーム '+session.roomCode:'未接続';
 $('roleLabel').textContent=seat?showSeatLabel(seat):'接続前';
 $('lobby').hidden=!!session;$('battle').hidden=!view;
 $('retryPanel').hidden=!waiting;
 $('retry').disabled=!waiting||retrying||!pendingCommand;
 if(!session)return;
 if(!view){feedback('相手の画面情報を読み込んでいます');return}
 const active=view.activePlayerId===seat,turn=view.phase==='turn',
  defense=view.phase==='defense';
 const player=view.players.find(p=>p.id===seat);
 const stats=$('scores');
 stats.replaceChildren();
 for(const p of view.players){
  const e=document.createElement('div');
  e.className='score'+(view.activePlayerId===p.id?' active':'');
  const title=document.createElement('div');title.className='player-title';
  const name=document.createElement('span');
  name.textContent=showSeatLabel(p.id)+(p.id===seat?' · 自分':'');
  title.append(name);
  if(view.activePlayerId===p.id){
   const dot=document.createElement('span');dot.className='turn-dot';
   dot.textContent='行動中';title.append(dot);
  }
  const line=document.createElement('div');line.className='statline';
  for(const [key,label,value] of [
   ['hp','HP',p.hp],['mp','MP',p.mp],['money','¥',p.money],
   ['count','手札',p.handCount]
  ]){
   const span=document.createElement('span');span.className=key;
   span.textContent=label+' '+value;line.append(span);
  }
  e.append(title,line);stats.append(e);
 }
 const mine=active&&(seat!=='A'||joined),busy=waiting;
 $('phase').textContent=view.phase==='finished'?'対戦終了':
  defense?(mine?'あなたの防御':'相手の防御待ち'):
  turn?(mine?'あなたの攻撃':'相手の攻撃待ち'):'処理中…';
 $('battleHint').textContent=busy?'操作結果を待っています':
  defense?(mine?'防具を選ぶか、「許す」':'相手の選択を待っています'):
  turn?(mine?'神器を選び、攻撃を確定':'相手の操作を待っています'):
  '試合結果を確認してください';
 const selected=player.hand||[];
 const route=view.pending?.type==='attack'?
  {source:view.pending.sourceId,target:view.pending.targetId}:
  turn?{source:view.activePlayerId,target:view.players.find(p=>p.id!==view.activePlayerId)?.id}:null;
 $('combatRoute').textContent=route?.source&&route?.target?
  '攻撃対象  '+showSeatLabel(route.source)+' → '+showSeatLabel(route.target):'';
 const announced=defense?view.pending?.declaredAttack:null;
 $('incomingAttack').hidden=!announced?.cards?.length;
 $('incomingAttack').textContent=announced?.cards?.length?
   '相手の攻撃：'+announced.cards.map(c=>names.get(c.definitionId)||c.definitionId).join(' ＋ ')+
   ' ／ 攻'+announced.printedAttackTotal+'（記載値）':'';
 $('handCount').textContent=selected.length+'枚 / 横にスライド';
 const preview=$('selectionPreview');preview.replaceChildren();
 const cardsById=new Map(selected.map(c=>[c.instanceId,c]));
 let attackSum=0,guardSum=0,mpSum=0,index=0;
 // The engine consumes selected cards in tap order. The preview must show
 // that same order, especially for defense effects requiring a first card.
 for(const instanceId of selection){
  const instance=cardsById.get(instanceId);
  if(!instance)continue;
  const def=catalog.get(instance.definitionId);
  attackSum+=def?.stats.attack||0;
  guardSum+=def?.stats.guard||0;
  mpSum+=def?.stats.mpCost||0;
  const chip=document.createElement('span');chip.className='picked';
  const order=document.createElement('b');order.textContent=String(++index)+'.';
  chip.append(order,document.createTextNode(
   names.get(instance.definitionId)||instance.definitionId));
  preview.append(chip);
 }
 if(!preview.childElementCount){
  const empty=document.createElement('span');empty.className='empty';
  empty.textContent=mine?'カードをタップして選択':'自分の番まで待機';
  preview.append(empty);
 }
 // Preview the printed stats, NOT a resolved damage estimate: elements,
 // reflections, multi-hits and special effects belong to the battle engine.
 $('selectionTotal').textContent=index?
  'カード記載値の合計（参考） · '+(defense?'守 '+guardSum:'攻 '+attackSum)+
   (mpSum?' · MP '+mpSum:''):'';

 const hand=$('hand'),scroll=hand.scrollLeft;
 hand.replaceChildren();
 for(const c of player.hand||[]){
  const def=catalog.get(c.definitionId),btn=document.createElement('button');
  const picked=selection.has(c.instanceId);
  const family=def?.family||'item';
  btn.type='button';btn.className='artifact '+family+(picked?' selected':'');
  const name=names.get(c.definitionId)||c.definitionId;
  const stats=def?.stats||{};
  const art=document.createElement('span');art.className='artmark';
  art.textContent=family==='weapon'?'⚔':family==='armor'?'▣':
   family==='miracle'?'✦':'◈';
  const label=document.createElement('span');label.className='cardname';
  label.textContent=name;
  const stat=document.createElement('span');stat.className='cardstats';
  stat.textContent=[stats.attack?'攻'+stats.attack:'',
    stats.guard?'守'+stats.guard:'',
    stats.mpCost?'MP'+stats.mpCost:''].filter(Boolean).join(' · ')||'神器';
  const price=document.createElement('span');price.className='cardprice';
  price.textContent='¥'+(stats.price??0);
  btn.append(art,label,stat,price);
  btn.setAttribute('aria-label',name+' '+stat.textContent);
  btn.setAttribute('aria-pressed',String(picked));
  btn.disabled=!active||waiting;
  btn.addEventListener('click',()=>{
   if(selection.has(c.instanceId))selection.delete(c.instanceId);
   else selection.add(c.instanceId);
   render();
  });
  hand.append(btn);
 }
 hand.scrollLeft=scroll;
 const usable=mine&&!busy;
 $('actions').hidden=!(turn||defense);
 $('attack').hidden=!turn;$('pray').hidden=!turn;$('discard').hidden=!turn;
 $('defend').hidden=!defense;
 $('attack').disabled=!usable||!selection.size;
 $('discard').disabled=!usable||!selection.size;
 $('pray').disabled=!usable||player.hand?.some(c=>catalog.get(c.definitionId)?.family==='weapon');
 $('defend').disabled=!usable;
 $('defend').textContent=selection.size?'防御する':'許す（防御なし）';
 if(seat==='A'&&!joined)feedback('相手が5桁のルーム番号で参加するのを待っています');
}
async function send(type){
 if(!session||!view||waiting||view.activePlayerId!==seat||seat==='A'&&!joined)return;
 const ids=[...selection];
 const command={commandId:randomId(),expectedRevision:view.revision,actorId:seat,type};
 if(type==='playCards'||type==='defend'||type==='discard')command.orderedInstanceIds=ids;
 if(type==='playCards')command.targetId=seat==='A'?'B':'A';
 waiting=true;pendingId=command.commandId;pendingCommand=command;
 feedback('操作を送信しています…');render();
 try{await session.submit(command)}catch(error){
  // A rejected card selection can be changed; a network failure after a
  // committed action must preserve the same command ID for safe resending.
  if(error?.commandRejected){
   waiting=false;pendingId=null;pendingCommand=null;
  }
  onError(error);render();
 }
}
async function retryPending(){
 if(!session||!waiting||!pendingCommand||retrying)return;
 retrying=true;feedback('同じ操作IDで再送しています…');render();
 try{
  await session.submit(pendingCommand);
  if(seat==='A'&&waiting){
   // Host submit publishes the authoritative state and reports its receipt.
   feedback('同期結果を確認しています…');
  }
 }catch(error){onError(error);}
 finally{retrying=false;render();}
}
$('create').addEventListener('click',async()=>{
 $('create').disabled=true;
 try{
  const database=ensureDb();
  const initialState=createStagingRoom({firstSeatId:'A',
   seats:[{id:'A',handDefinitionIds:['w016','d001','m002','d003']},
    {id:'B',handDefinitionIds:['w027','d003','m001','d001']}],
   rulesetId:'partial-reference-v2-lab',rngSeed:71},catalog);
  for(let i=0;i<5;i++){
   try{
    const roomCode=code();
    seat='A';joined=false;
    session=await createFirebaseTwoSeatHostFixture({db:database,code:roomCode,
     hostId:randomId(),initialState,catalog,...callbacks()});
    break;
   }catch(e){if(!/使用中/.test(e.message)||i===4)throw e;}
  }
  render();feedback('ルーム番号を友達に伝えてください');
 }catch(e){onError(e);seat=null;}finally{$('create').disabled=!!session}
});
$('join').addEventListener('click',async()=>{
 $('join').disabled=true;
 try{
  const database=ensureDb(),roomCode=$('joinCode').value.trim();
  const key='godfield-v2-guest-'+roomCode;
  // Google Sites can use an isolated iframe origin with storage disabled.
  // The ID only improves same-tab rejoin; a first join must not require storage.
  let previousId=null;
  try{previousId=sessionStorage.getItem(key)}catch{}
  const guestId=previousId||randomId();
  seat='B';joined=true;
  session=await joinFirebaseTwoSeatGuestFixture({db:database,code:roomCode,guestId,...callbacks()});
